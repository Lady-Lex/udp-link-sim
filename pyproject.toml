[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udp-link-sim"
version = "0.1.0"
description = "Windows IPv4 UDP link simulator with high-resolution delay, jitter, loss, and PySide6 QML GUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.12.0",
]

[project.scripts]
udplinksim = "udplinksim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"udplinksim.gui" = ["qml/*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
